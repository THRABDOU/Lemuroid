name: Build Lemuroid APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'debug'
          - 'both'
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/checkstyle.yml'
      - '.github/workflows/publish.yml'

jobs:
  build:
    name: Build Lemuroid APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create self-signed release keystore
        run: |
          keytool -genkey -v \
            -keystore release.jks \
            -alias lemuroid \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass lemuroid \
            -keypass lemuroid \
            -dname "CN=Lemuroid, OU=Mobile, O=Custom, L=Unknown, S=Unknown, C=US"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          echo "Selected build type: $BUILD_TYPE"
          
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleFreeDynamicRelease assembleFreeBundleRelease --stacktrace
          elif [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleFreeDynamicDebug assembleFreeBundleDebug --stacktrace
          else
            ./gradlew assembleFree --stacktrace
          fi

      - name: Organize output APKs
        run: |
          mkdir -p output-apks
          find lemuroid-app/build/outputs/apk/ -name "*.apk" -exec cp {} output-apks/ \;
          ls -la output-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lemuroid-APKs
          path: output-apks/*.apk
          retention-days: 14
