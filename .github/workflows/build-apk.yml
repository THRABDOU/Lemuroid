name: Build Lemuroid APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create self-signed release keystore
        run: |
          keytool -genkey -v \
            -keystore release.jks \
            -alias lemuroid \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass lemuroid \
            -keypass lemuroid \
            -dname "CN=Lemuroid, OU=Mobile, O=Custom, L=Unknown, S=Unknown, C=US"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Free Dynamic Release APK
        run: ./gradlew assembleFreeDynamicRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lemuroid-Release-APK
          path: lemuroid-app/build/outputs/apk/freeDynamic/release/*.apk
          retention-days: 14
